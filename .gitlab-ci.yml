---
variables:
  MAIN_REPO: "https://gitlab.com/haproxy-haptic/haptic.git"
  PYTHON_DOCS_IMAGE: >-
    registry.gitlab.com/haproxy-haptic/haptic/ci/python-docs:latest@sha256:f98c072e0ce50f2d0b282e5d644e8d4ed371977eb40ba53a51c41b8aeca48ad5

stages:
  - test
  - deploy

test:
  stage: test
  image: ${PYTHON_DOCS_IMAGE}
  tags:
    - saas-linux-small-amd64
  script:
    - bash scripts/test.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: >-
        $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH &&
        $CI_PIPELINE_SOURCE == "push"
    - if: >-
        $CI_PIPELINE_SOURCE == "api" &&
        $CI_COMMIT_TAG =~ /^pages-publisher-[0-9a-f]{40}$/ &&
        ($PLAYGROUND_UI_HOTFIX_VERSION || $PAGES_REFRESH_VERSIONS == "true")

pages:
  stage: deploy
  image: ${PYTHON_DOCS_IMAGE}
  tags:
    - saas-linux-small-amd64
  resource_group: pages-publication
  script:
    - ./scripts/restore-pages-artifact.sh ./public
    - |
      if [ -n "${PLAYGROUND_UI_HOTFIX_VERSION:-}" ] || [ "${PAGES_REFRESH_VERSIONS:-false}" = true ]; then
        python3 scripts/site_versions.py ./public
        patch_args=()
        if [ -n "${PLAYGROUND_UI_HOTFIX_VERSION:-}" ]; then
          patch_args=(--require-version "$PLAYGROUND_UI_HOTFIX_VERSION")
        fi
        python3 scripts/apply-playground-ui-patches.py ./public "${patch_args[@]}"
        exit 0
      fi
    - VERSION="${DOC_VERSION:?DOC_VERSION is required}"
    - >-
      SOURCE_COMMIT="${HAPTIC_RELEASE_COMMIT_SHA:?
      HAPTIC_RELEASE_COMMIT_SHA is required}"
    - echo "Publishing ${VERSION} from ${SOURCE_COMMIT}"
    - |
      if [ "${PAGES_LINEAGE_SEED_ONLY:-false}" = true ]; then
        echo "Seeded the publisher lineage without changing site content"
        exit 0
      fi
    - |
      git init -q main-repo
      git -C main-repo remote add origin "$MAIN_REPO"
      git -C main-repo fetch --depth 1 origin "$SOURCE_COMMIT"
      git -C main-repo checkout -q --detach FETCH_HEAD
      [ "$(git -C main-repo rev-parse HEAD)" = "$SOURCE_COMMIT" ]
    - ./scripts/deploy-docs.sh "$VERSION" ./main-repo ./public
  artifacts:
    paths:
      - public
    expire_in: never
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline"
    - if: >-
        $CI_PIPELINE_SOURCE == "api" &&
        $CI_COMMIT_TAG =~ /^pages-publisher-[0-9a-f]{40}$/ &&
        ($PLAYGROUND_UI_HOTFIX_VERSION || $PAGES_REFRESH_VERSIONS == "true")
    - if: >-
        $CI_PIPELINE_SOURCE == "api" &&
        $CI_COMMIT_TAG =~ /^pages-publisher-[0-9a-f]{40}$/ &&
        $PAGES_LINEAGE_SEED_ONLY == "true" &&
        $PAGES_BOOTSTRAP_JOB_ID &&
        $PAGES_BOOTSTRAP_ARTIFACT_SHA256

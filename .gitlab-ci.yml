---
variables:
  MAIN_REPO: "https://gitlab.com/haproxy-haptic/haptic.git"
  PYTHON_DOCS_IMAGE: >-
    registry.gitlab.com/haproxy-haptic/haptic/ci/python-docs:latest@sha256:f98c072e0ce50f2d0b282e5d644e8d4ed371977eb40ba53a51c41b8aeca48ad5

stages:
  - test
  - deploy

test:
  stage: test
  image: ${PYTHON_DOCS_IMAGE}
  tags:
    - saas-linux-small-amd64
  script:
    - bash -n scripts/deploy-docs.sh scripts/test-deploy-docs.sh
    - bash scripts/test-deploy-docs.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: >-
        $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH &&
        $CI_PIPELINE_SOURCE == "push"

pages:
  stage: deploy
  image: ${PYTHON_DOCS_IMAGE}
  tags:
    - saas-linux-small-amd64
  resource_group: pages-publication
  script:
    - VERSION="${DOC_VERSION:?DOC_VERSION is required}"
    - >-
      SOURCE_COMMIT="${HAPTIC_RELEASE_COMMIT_SHA:?
      HAPTIC_RELEASE_COMMIT_SHA is required}"
    - echo "Publishing ${VERSION} from ${SOURCE_COMMIT}"
    - |
      artifact_url="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}"
      artifact_url="${artifact_url}/jobs/artifacts/main/download?job=pages"
      curl -sSfL --output pages-artifact.zip \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "$artifact_url" ||
        {
          echo "The previous Pages artifact is required" >&2
          exit 1
        }
      unzip -q pages-artifact.zip
      rm pages-artifact.zip
      if [ ! -d public ]; then
        echo "The previous Pages artifact has no public directory" >&2
        exit 1
      fi
    - |
      git init -q main-repo
      git -C main-repo remote add origin "$MAIN_REPO"
      git -C main-repo fetch --depth 1 origin "$SOURCE_COMMIT"
      git -C main-repo checkout -q --detach FETCH_HEAD
      [ "$(git -C main-repo rev-parse HEAD)" = "$SOURCE_COMMIT" ]
    - ./scripts/deploy-docs.sh "$VERSION" ./main-repo ./public
  artifacts:
    paths:
      - public
    expire_in: never
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline"

variables:
  MAIN_REPO: "https://gitlab.com/haproxy-template-ic/haproxy-template-ingress-controller.git"

pages:
  stage: deploy
  image: python:3.12-slim
  tags:
    - saas-linux-small-amd64
  before_script:
    - pip install --no-cache-dir mkdocs-material mike
    - apt-get update && apt-get install -y --no-install-recommends git
    - git config --global user.email "ci@gitlab.com"
    - git config --global user.name "GitLab CI"
  script:
    - |
      # Clone the main repository (public, no auth needed)
      git clone --depth 1 ${MAIN_REPO} main-repo
    - |
      # Copy shared CSS to all doc sites
      cp main-repo/docs/shared/colors.css main-repo/docs/controller/docs/stylesheets/
      cp main-repo/docs/shared/colors.css main-repo/docs/landing/docs/stylesheets/
      cp main-repo/docs/shared/colors.css main-repo/charts/haproxy-template-ic/docs/stylesheets/
    - |
      # Initialize public directory with existing content from this repo
      mkdir -p public
      cd public
      git init
      git remote add origin ..
      git fetch origin main --depth=1 || true
      # Checkout existing content or create new branch
      git checkout main 2>/dev/null || git checkout -b main
      cd ..
    - |
      # Deploy controller docs with mike (adds/updates dev version)
      cd main-repo/docs/controller
      mike deploy --update-aliases --deploy-prefix controller -b main -r ../../../public dev latest
      cd ../../..
    - |
      # Deploy helm-chart docs with mike
      cd main-repo/charts/haproxy-template-ic
      mike deploy --update-aliases --deploy-prefix helm-chart -b main -r ../../../public dev latest
      cd ../../..
    - |
      # Get deployed content from mike's commits into working directory
      cd public && git reset --hard HEAD && cd ..
    - |
      # Build landing page on top (preserving mike's output)
      cd main-repo/docs/landing
      mkdocs build -d ../../../public --dirty
      cd ../../..
    - |
      # Copy shared assets
      mkdir -p public/shared
      cp main-repo/docs/shared/colors.css public/shared/colors.css
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "pipeline"  # Triggered from main project

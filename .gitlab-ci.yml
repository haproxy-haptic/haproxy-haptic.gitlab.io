variables:
  MAIN_REPO: "https://gitlab.com/haproxy-haptic/haptic.git"

pages:
  stage: deploy
  image: python:3.14-slim
  tags:
    - saas-linux-small-amd64
  before_script:
    # Pin mkdocs<2 to avoid incompatibility with mkdocs-material
    # (see https://squidfunk.github.io/mkdocs-material/blog/2026/02/18/mkdocs-2.0/)
    - pip install --no-cache-dir "mkdocs>=1.6,<2" mkdocs-material
    - apt-get update && apt-get install -y --no-install-recommends git jq curl unzip
  script:
    # Use DOC_VERSION from trigger, default to "dev" for regular builds
    - VERSION="${DOC_VERSION:-dev}"
    - echo "Building docs version ${VERSION}"

    # Download existing versions.json to temp location (mkdocs cleans public dir during build)
    - |
      echo "Downloading existing versions.json files..."
      mkdir -p /tmp/versions-backup
      for prefix in controller helm-chart; do
        if curl -sSf "https://haproxy-haptic.org/${prefix}/versions.json" -o "/tmp/versions-backup/${prefix}-versions.json" 2>/dev/null; then
          echo "  Downloaded ${prefix}/versions.json:"
          cat "/tmp/versions-backup/${prefix}-versions.json"
          echo ""
        else
          echo "  No existing ${prefix}/versions.json found"
        fi
      done
      export VERSIONS_BACKUP_DIR="/tmp/versions-backup"

    # Download existing pages artifact to preserve all version directories
    - |
      echo "Downloading existing pages artifact..."
      if curl -sSf --location --output pages-artifact.zip \
          "https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/jobs/artifacts/main/download?job=pages" 2>/dev/null; then
        unzip -q -o pages-artifact.zip
        rm pages-artifact.zip
        echo "Restored existing site content:"
        ls -la public/ || true
      else
        echo "No existing artifact found, starting fresh"
        mkdir -p public
      fi

    # Clone at specific version for releases, main branch for dev
    - |
      if [ "$VERSION" = "dev" ]; then
        echo "Cloning main branch for dev docs..."
        git clone --depth 1 ${MAIN_REPO} main-repo
      else
        echo "Cloning tag ${VERSION} for release docs..."
        git clone --depth 1 --branch "${VERSION}" ${MAIN_REPO} main-repo
      fi
    - ./scripts/deploy-docs.sh "${VERSION}" ./main-repo ./public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "pipeline"  # Triggered from main project

test:
  stage: test
  image: python:3.14-slim
  tags:
    - saas-linux-small-amd64
  script:
    - pip install --no-cache-dir "mkdocs>=1.6,<2" mkdocs-material
    - mkdocs --version
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

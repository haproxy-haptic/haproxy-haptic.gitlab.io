variables:
  MAIN_REPO: "https://gitlab.com/haproxy-template-ic/haproxy-template-ingress-controller.git"

pages:
  stage: deploy
  image: python:3.12-slim
  tags:
    - saas-linux-small-amd64
  before_script:
    - pip install --no-cache-dir mkdocs-material
    - apt-get update && apt-get install -y --no-install-recommends git jq curl
  script:
    # Use DOC_VERSION from trigger, default to "dev" for regular builds
    - VERSION="${DOC_VERSION:-dev}"
    - echo "Building docs version ${VERSION}"

    # Download existing versions.json to temp location (mkdocs cleans public dir during build)
    - |
      echo "Downloading existing versions.json files..."
      mkdir -p /tmp/versions-backup
      for prefix in controller helm-chart; do
        if curl -sSf "https://haproxy-haptic.org/${prefix}/versions.json" -o "/tmp/versions-backup/${prefix}-versions.json" 2>/dev/null; then
          echo "  Downloaded ${prefix}/versions.json:"
          cat "/tmp/versions-backup/${prefix}-versions.json"
          echo ""
        else
          echo "  No existing ${prefix}/versions.json found"
        fi
      done
      export VERSIONS_BACKUP_DIR="/tmp/versions-backup"

    - git clone --depth 1 ${MAIN_REPO} main-repo
    - ./scripts/deploy-docs.sh "${VERSION}" ./main-repo ./public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "pipeline"  # Triggered from main project
